[project]
name = "iyamurinze-rl-summative"
version = "0.1.0"
description = "AgriScout: a crop-scouting drone RL agent over Rwandan farmland (DQN, REINFORCE, PPO, A2C with TorchRL)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26,<2",
    "torch>=2.2,<2.3",
    "torchrl>=0.3.0,<0.4",
    "tensordict>=0.3.0,<0.4",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "websockets>=13.0",
    "requests>=2.32",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "python-docx>=1.2.0",
]
